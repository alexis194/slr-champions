<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Champions | P6 national exam practice</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2A52">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Champions">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--navy:#1B2A52;--navy2:#2a3d6e;--gold:#E7B500;--bg:#f3f5fa;--ink:#1d2433;--muted:#5b6478;--ok:#157a3c;--okbg:#e6f5ea;--bad:#b42318;--badbg:#fdeceb;--part:#a35a07;--partbg:#fff3df;--card:#fff;--line:#d8deea;--sel:#dbe6ff}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45;min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:disabled{cursor:default}
.rw{display:none;font-style:italic;font-size:.8em;opacity:.85;font-weight:normal}
body.rwon .rw{display:block}
header.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 18px;position:sticky;top:0;z-index:30;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand svg{width:40px;height:40px;flex:none}
.brand .t1{font-weight:700;font-size:15px;line-height:1.2}
.brand .t2{font-size:12px;color:#c9d2ea}
.brand .t1 em{color:var(--gold);font-style:normal}
.hspace{flex:1}
.hbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:6px 12px;font-size:14px}
.hbtn:hover{background:rgba(255,255,255,.22)}
.hbtn.on{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
.chip{display:flex;align-items:center;gap:6px}
main{flex:1;width:100%;max-width:1060px;margin:0 auto;padding:22px 18px 40px}
footer{background:var(--navy);color:#c9d2ea;font-size:13px;display:flex;justify-content:space-between;padding:10px 18px}
h1,h2,h3{margin:.2em 0 .5em;color:var(--navy)}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(27,42,82,.08);padding:20px;margin-bottom:18px}
.btn{background:var(--navy);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-weight:600;font-size:17px}
.btn:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.gold:hover{filter:brightness(1.05)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.small{padding:7px 14px;font-size:15px;border-radius:10px}
.btn.green{background:var(--ok)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
/* hello */
.hello{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,var(--navy),#334c8a);color:#fff}
.hello h2{color:#fff;margin:0}
.bigav{font-size:52px;background:rgba(255,255,255,.15);border-radius:50%;width:84px;height:84px;display:flex;align-items:center;justify-content:center;flex:none}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.stat{background:rgba(255,255,255,.14);border-radius:12px;padding:6px 12px;font-size:15px}
.stat b{color:var(--gold);font-size:18px}
.lvlbar{height:9px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin-top:6px;max-width:320px}
.lvlbar i{display:block;height:100%;background:var(--gold)}
/* mode cards */
.mode{border:none;text-align:left;border-radius:18px;padding:18px;color:#fff;min-height:170px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 12px rgba(0,0,0,.12);transition:transform .12s}
.mode:hover{transform:translateY(-3px)}
.mode .ic{font-size:36px}
.mode .mt{font-size:21px;font-weight:800}
.mode .md{font-size:14px;opacity:.95}
.m10{background:linear-gradient(135deg,#0f9d77,#16b88b)}
.nuwrap{display:flex;flex-direction:column;gap:10px;margin:6px 0}
.nurow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nul{min-width:120px;font-weight:600}
.nuin{border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:18px;width:200px;font-family:inherit}
.nuin.right{border-color:var(--ok);background:#ecfdf3}.nuin.wrong{border-color:var(--bad);background:#fef2f2}
.nuu{color:var(--muted);font-weight:600}
.passage{background:#fffdf3;border:2px solid #f1d98a;border-radius:14px;padding:10px 16px;margin:0 0 14px}
.passage summary{cursor:pointer;font-size:16px;color:var(--navy)}
.passage .ptext{font-size:16px;line-height:1.65;margin-top:8px;max-height:420px;overflow:auto;padding-right:6px}
.passage .ptext p{margin:0 0 10px}
textarea.wr{min-height:300px;line-height:1.6}
.sjsw{display:inline-flex;gap:6px;flex-wrap:wrap}
.sjsw button{border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:16px;padding:4px 12px;font-weight:700;cursor:pointer}
.sjsw button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.sjsw.dark button{border-color:var(--line);color:var(--navy)}
.sjgrid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.sjgrid>.sj{flex:0 1 calc(33.333% - 11px);min-width:240px}
@media(max-width:640px){.sjgrid>.sj{flex-basis:100%}}
.sj{min-height:220px;position:relative}
.sj .cnt{margin-top:auto;font-size:13px;font-weight:700;background:rgba(255,255,255,.18);border-radius:10px;padding:4px 10px;align-self:flex-start}
.sj.locked{filter:grayscale(.9);opacity:.55;cursor:not-allowed;user-select:none}
.sj.locked:hover{transform:none}
.sj .soon{position:absolute;top:14px;right:14px;background:#fff;color:var(--navy);font-weight:800;font-size:13px;border-radius:12px;padding:3px 10px}
.sjm{background:linear-gradient(135deg,#c2410c,#ea7a2a)}.sje{background:linear-gradient(135deg,#be185d,#e0559a)}.sjk{background:linear-gradient(135deg,#a16207,#d4a017)}
.sjs{background:linear-gradient(135deg,#0f766e,#22a39a)}.sjc{background:linear-gradient(135deg,#6d28d9,#9b6bea)}.sjb{background:linear-gradient(135deg,#15803d,#3fae5f)}.lem{font-size:42px;letter-spacing:6px;margin:6px 0 10px;text-align:center}.lex{background:#eef2fb;border-left:5px solid var(--navy);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:17px}.luse{background:#fff7e0;border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:17px}.luse ul{margin:6px 0 0}.lkind{display:inline-block;font-size:14px;background:#eef2fb;color:var(--navy);border-radius:12px;padding:2px 10px;margin-right:6px;vertical-align:middle}.lans{background:#e8f6ec;border-left:5px solid #157a3c;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:17px}.lmis{background:#fdecea;border-left:5px solid #b42318;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:17px}.sjh{flex:0 0 100%;margin:10px 0 0;color:var(--navy);font-size:20px;text-align:left}
.m30{background:linear-gradient(135deg,#2563c9,#3b82f6)}
.m60{background:linear-gradient(135deg,#7c3aed,#9b5cf6)}
.mco{background:linear-gradient(135deg,#0f766e,#14a38f)}.m120{background:linear-gradient(135deg,#1B2A52,#2f4a8f);border:3px solid var(--gold)!important}
.tool{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;font-weight:600;color:var(--navy)}
.tool:hover{border-color:var(--navy)}
.tool .ic{font-size:30px}
.tool small{display:block;font-weight:400;color:var(--muted)}
/* topics */
.topic{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.topic:hover{border-color:var(--navy)}
.topic .tn{font-weight:700;color:var(--navy)}
.bar{height:10px;background:#e7ebf3;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%}
.tag{display:inline-block;font-size:12px;border-radius:10px;padding:1px 8px;font-weight:600}
.tg0{background:#eef0f5;color:#5b6478}.tg1{background:var(--badbg);color:var(--bad)}.tg2{background:var(--partbg);color:var(--part)}.tg3{background:var(--okbg);color:var(--ok)}
/* session bar */
.sbar{position:sticky;top:56px;z-index:20;background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:10px 16px;display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.timer{font-weight:800;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.prog{flex:1;min-width:120px;height:12px;background:#e7ebf3;border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f5cf3d);transition:width .3s}
/* exam paper */
.paper{background:#fff;max-width:860px;margin:0 auto;padding:34px 40px;box-shadow:0 3px 16px rgba(0,0,0,.12);font-family:Georgia,"Bookman Old Style","Times New Roman",serif;color:#111}
.paper h1,.paper h2{color:#111;text-align:center}
.phead{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.pbox{border:2px solid #111;padding:10px 14px;text-align:center;flex:1;min-width:220px}
.pbox .big{font-size:30px;font-weight:700}
.ptitle{text-align:center;margin:14px 0}
.ptitle .l1{font-weight:700;font-size:16px}
.ptitle .l2{font-weight:700;font-size:23px;margin:6px 0}
.ptitle .l3{font-weight:700;font-size:19px}
.mbox{display:inline-block;border:2px solid #111;padding:6px 26px;margin-top:6px;font-weight:700;font-size:20px}
.instr{font-size:15px;margin:16px 0}
.att{font-weight:700;font-size:18px;margin:20px 0 10px}
.q{padding:14px 0 18px;border-bottom:1px dashed #c9ced8}
.qline{display:flex;gap:8px;align-items:flex-start}
.qn{font-weight:700;min-width:32px}
.qt{flex:1}
.qm{font-weight:700;white-space:nowrap;font-size:15px}
.hint{font-family:"Segoe UI",Arial,sans-serif;font-size:13px;color:var(--muted);margin:4px 0 6px 40px}
.qb{margin-left:40px;font-family:"Segoe UI",Arial,sans-serif}
/* practice card */
.pcard{background:#fff;border-radius:18px;box-shadow:0 3px 14px rgba(27,42,82,.1);padding:24px 26px;max-width:860px;margin:0 auto}
.pcard .qline{font-size:19px}
.ptopic{display:inline-block;background:#eef2fb;color:var(--navy);border-radius:10px;padding:3px 10px;font-size:13px;font-weight:600;margin-bottom:10px}
/* answer widgets */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 12px}
.opt:hover:not(:disabled){border-color:#8aa0d6}
.let{width:32px;height:32px;border-radius:50%;border:2px solid #9aa3b8;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:var(--navy)}
.opt.sel{border-color:var(--navy);background:var(--sel)}
.opt.sel .let{border:3px solid var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(27,42,82,.15)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .let{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.tfrow{display:flex;gap:10px;align-items:center;padding:7px 0;flex-wrap:wrap}
.tfl{font-weight:700;width:22px}
.tfs{flex:1;min-width:220px}
.pill{border:2px solid var(--line);background:#fff;border-radius:20px;padding:5px 16px;font-weight:600;margin-left:4px}
.pill.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.pill.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
table.mt{border-collapse:collapse;width:100%;margin-top:6px}
table.mt td,table.mt th{border:1px solid #b9c0d0;padding:7px 9px;vertical-align:middle;text-align:left}
table.mt th{background:#f1f4fa;font-size:15px}
select{font-family:inherit;font-size:15px;padding:5px 6px;border-radius:8px;border:2px solid var(--line);max-width:100%}
select.sel{border-color:var(--navy);background:var(--sel)}
.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}
.cellbtn{width:44px;height:36px;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:20px;font-weight:700;color:var(--navy)}
.cellbtn.sel{border-color:var(--navy);background:var(--sel)}
.cellbtn.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.cellbtn.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.bank{display:flex;gap:8px;flex-wrap:wrap;border:2px dashed #b9c0d0;border-radius:10px;padding:8px 10px;margin:6px 0 10px}
.bank span{background:#f1f4fa;border-radius:8px;padding:2px 10px;font-weight:600}
.fbline{padding:7px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.ochip{border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;text-align:left}
.ochip:disabled{opacity:.4}
.seq{background:#f6f8fc;border-radius:10px;padding:8px 12px;min-height:44px;margin:6px 0}
.seq div{padding:2px 0}
textarea{width:100%;font-family:inherit;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:10px;min-height:76px}
textarea:focus{border-color:var(--navy);outline:none}
.cv{border:2px dashed #9aa3b8;border-radius:10px;background:#fff;touch-action:none;max-width:100%;cursor:crosshair}
.dr-wrap{position:relative;display:inline-block;max-width:100%;user-select:none}
.dr-wrap svg,.dr-wrap img{display:block;max-width:100%;height:auto;pointer-events:none}
.dr-wrap{cursor:crosshair}
.drl-placed{position:absolute;background:rgba(27,42,82,.85);color:#fff;font-size:12px;font-weight:600;padding:2px 7px;border-radius:12px;cursor:pointer;white-space:nowrap;transform:translate(-50%,-50%);pointer-events:all;border:1.5px solid #E7B500;z-index:3}
.drl-placed:hover{background:var(--bad);border-color:var(--bad)}
.drlb-static{position:relative;display:inline-block;max-width:100%}
.drlb-static svg,.drlb-static img{display:block;max-width:100%;height:auto;pointer-events:none}
.dr-word-cards{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.dr-card{padding:4px 10px;background:#e8ecf7;border:1.5px solid #b0bdd6;border-radius:16px;font-size:13px;font-weight:600;cursor:grab;touch-action:none}
.dr-card.used{opacity:.4;cursor:not-allowed;background:#ccd3e0}
.dr-card.dragging{opacity:.7;background:#1B2A52;color:#fff;cursor:grabbing}
.dr-type-hint{font-size:13px;color:var(--muted);margin:4px 0 2px}
.fig{margin:8px 0;text-align:center}
.fig svg{max-width:100%;height:auto}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px;font-family:"Segoe UI",Arial,sans-serif}
.fb.good{background:var(--okbg);border:2px solid #9fd8b1}
.fb.part{background:var(--partbg);border:2px solid #f2c98c}
.fb.bad{background:var(--badbg);border:2px solid #f3b4ae}
.fb .h{font-weight:800;font-size:18px}
.ansbox{background:#fff;border-radius:10px;padding:8px 12px;margin-top:8px;border:1px solid var(--line)}
.ansbox .lab{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.why{margin-top:6px;font-size:15px;color:#3a4256}
.checks label{display:flex;gap:8px;align-items:center;padding:3px 0}
.checks input{width:20px;height:20px}
.adj{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)}
/* results */
.score{font-size:58px;font-weight:900;color:var(--navy);line-height:1}
.score small{font-size:24px;color:var(--muted)}
.ring{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ring div{width:118px;height:118px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:var(--navy)}
table.tt{border-collapse:collapse;width:100%}
table.tt td,table.tt th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.badge{border-radius:14px;border:2px solid var(--line);padding:10px;text-align:center;background:#fff}
.badge .bi{font-size:34px}
.badge.off{opacity:.35;filter:grayscale(1)}
/* lightning */
.lt{max-width:760px;margin:0 auto;text-align:center}
.lq{font-size:24px;font-weight:700;color:var(--navy);min-height:110px;display:flex;align-items:center;justify-content:center;padding:10px}
.lbtns{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.lbtn{font-size:20px;font-weight:700;padding:16px;border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--navy)}
.lbtn:hover{border-color:var(--navy)}
.lbtn.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.lbtn.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.lscore{font-size:40px;font-weight:900;color:var(--navy)}
/* profiles */
.pf{background:#fff;border:3px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.pf:hover{border-color:var(--gold)}
.pf .av{font-size:54px}
.pf .nm{font-weight:800;font-size:19px;color:var(--navy)}
.avs{display:flex;gap:8px;flex-wrap:wrap}
.avs button{font-size:30px;width:56px;height:56px;border-radius:14px;border:3px solid var(--line);background:#fff}
.avs button.sel{border-color:var(--gold);background:#fff8dc}
input[type=text],input[type=date],input[type=email],input[type=time],input[type=tel],input[type=number],input[type=url],textarea.lfa{font-family:inherit;font-size:17px;padding:9px 12px;border:2px solid var(--line);border-radius:10px}
.modal{position:fixed;inset:0;background:rgba(10,18,40,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .card{max-width:520px;width:100%;margin:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:14px;z-index:70;box-shadow:0 4px 16px rgba(0,0,0,.3);font-weight:600;border:2px solid var(--gold)}
.starpop{position:fixed;font-size:30px;font-weight:900;color:var(--gold);z-index:80;pointer-events:none;animation:pop 1.1s ease-out forwards;text-shadow:0 2px 4px rgba(0,0,0,.25)}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.7)}20%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:90;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.center{text-align:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:600;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tw{overflow-x:auto}
tr.clk{cursor:pointer}tr.clk:hover td{background:#f6f8fc}
table.mx{border-collapse:collapse;width:100%}
table.mx td,table.mx th{border:1px solid var(--line);padding:6px;text-align:center;font-size:14px}
table.mx td:first-child,table.mx th:first-child{text-align:left;white-space:nowrap}
.ck{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;cursor:pointer}
.ck input{width:18px;height:18px;flex:none}
.tight{gap:8px}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0}
.frm label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
.gchip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 4px;border-radius:16px;margin:3px 4px 3px 0;font-size:14px;cursor:pointer;background:#fff;border:1px solid var(--line)}

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function streak(p){const set=new Set(p.days||[]);let n=0;const d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(set.has(k)){n++;d.setDate(d.getDate()-1);}else break;}return n;}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function B(en,rw){return en+(rw?`<span class="rw">${rw}</span>`:'');}
function fmtM(x){return (Math.round(x*2)/2).toString().replace('.5','½').replace(/^0½/,'½');}
function fbEq(a,b){const x=norm(a),y=norm(b);return (x||y)?x===y:String(a||'').trim()===String(b||'').trim();}
function norm(s){return String(s||'').toLowerCase().replace(/°/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();}
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function kw(text,q){const nt=norm(text);const t=' '+nt+' ',words=nt.split(' ');let n=0;
 q.k.forEach(g=>{const ok=g.split('|').some(a=>{if(a[0]==='#'){a=norm(a.slice(1));return a&&t.includes(' '+a+' ');}a=norm(a);if(!a)return false;if(t.includes(a))return true;
  if(a.length>=5&&a.indexOf(' ')<0)return words.some(w=>w.length>=a.length-1&&(lev(w.slice(0,a.length),a)<=1||lev(w.slice(0,a.length+1),a)<=1));return false;});if(ok)n++;});
 return Math.min(q.m,n*q.per);}

 ${vTopicProgressBar(p)}`:homeMenu(p)}`;}
function vTopicProgressBar(p){const rows=TOPICS.map(t=>{const m=mastery(p,t.id);const pct=m.pct===null?0:Math.round(m.pct*100);const col=pct>=80?'var(--good)':pct>=50?'var(--gold)':'var(--bad)';return {t,pct,col};});if(rows.every(r=>r.pct===0))return '';return `<div class="card" style="margin-top:20px"><h3 style="margin:0 0 12px">${B('My topic mastery','Ubwenge kuri buri isomo')}</h3><div style="display:flex;flex-direction:column;gap:8px">${rows.map(({t,pct,col})=>`<div style="display:flex;align-items:center;gap:8px"><div style="width:28px;text-align:center;font-size:18px">${t.ic}</div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--navy);margin-bottom:3px">${t.en}</div><div style="height:12px;background:#eee;border-radius:6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${col};border-radius:6px;transition:width .4s"></div></div></div><div style="width:38px;text-align:right;font-size:13px;font-weight:700;color:${col}">${pct}%</div><button class="btn small ghost" style="padding:2px 8px;font-size:12px" onclick="startTopic('${t.id}')" title="Practise ${t.en}">▶</button></div>`).join('')}</div></div>`;}

${(m.full||PEND.k==='m60')&&typeof lvExamQs==='function'&&lvExamQs(PEND.k,true)?lvExamNote(PEND.k):m.full?`<div class="notice">${SJ().fullNote}</div>`:''}

/* ============== BUILD SESSIONS ============== */
function pickFrom(tp,m,used,nc){const seen=P().seen;let c=BANK.filter(q=>q.tp===tp&&!used.has(q.id)&&!((nc||m!=null)&&q.cq)&&(m==null?q.t!=='wr':q.m===m));
 if(!c.length&&m!=null)return pickFrom(tp,null,used,true);if(!c.length)return null;
 c=c.map(q=>({q,k:(seen[q.id]||0)+Math.random()*1.6-(q.cq?1.3:0)})).sort((a,b)=>a.k-b.k);used.add(c[0].q.id);return c[0].q;}
function buildQs(k){const m=MODES[k],used=new Set();let qs=[];
 if(m.full){if(SJ().full2)return SJ().full2(used);BLUE.forEach(([tp,mk])=>{const q=pickFrom(tp,mk,used);if(q)qs.push(q);});return qs;}
 const order=TOPICS.map(t=>t.id).filter(t=>t!==faithSkip());
 if(k==='m10'){const tps=shuffle(order).slice(0,m.n);order.forEach(tp=>{if(tps.includes(tp)){const q=pickFrom(tp,null,used);if(q)qs.push(q);}});return qs;}
 const per=Math.round(m.n/10);order.forEach(tp=>{for(let i=0;i<per;i++){const q=pickFrom(tp,null,used);if(q)qs.push(q);}});return qs;}
function mkInst(q){const it={q,resp:null,done:false,got:0,final:null};
 if(q.t==='mc'||q.t==='ms'){it.ord=q.fixed?q.o.map((_,i)=>i):shuffle(q.o.map((_,i)=>i));it.resp=q.t==='ms'?[]:null;}
 if(q.t==='ma'){it.ord=shuffle(q.r.map((_,i)=>i));it.resp=q.l.map(()=>null);}
 if(q.t==='tf')it.resp=q.s.map(()=>null);
 if(q.t==='fb'){it.resp=q.s.map(()=>'');it.pool=q.s.map(s=>s[2]?s[2]:shuffle(q.o?q.o:q.s.map(x=>x[1])));}
 if(q.t==='cl'){it.resp=q.i.map(()=>null);it.iord=shuffle(q.i.map((_,i)=>i));}
 if(q.t==='or'){let o;do{o=shuffle(q.i.map((_,i)=>i));}while(o.every((x,i)=>x===i)&&q.i.length>1);it.ord=o;it.resp=[];}
 if(q.t==='op')it.resp='';
 if(q.t==='dr'){it.checks=(q.checks||[]).map(()=>false);it.img=null;it.labels=[];}
 if(q.t==='wr'){it.resp='';it.checks=wrChecks(q).map(()=>false);}
 if(q.t==='nu')it.resp=q.p.map(()=>'');
 return it;}
function startSession(k,style,qs,title,extra){stopTimer();const m=MODES[k]||null;
 if(!qs&&typeof lvExamQs==='function'&&(k==='m120'||k==='m60')){const lx=lvExamQs(k);if(lx){qs=lx.qs;title=title||lx.lab+' exam, '+lx.mins+' minutes';extra=Object.assign({limit:lx.mins*60,lvExam:{l:lx.l,lab:lx.lab,mins:lx.mins}},extra||{});}}
 qs=qs||buildQs(k);
 if(!qs.length){const i=P()&&typeof lvInfo==='function'?lvInfo(P()):null;toast('There are no questions here yet. Ask your teacher to add some.',4500);return;}
 SES={k,style,title:title||(m?m.en:''),items:qs.map(mkInst),i:0,start:Date.now(),limit:m?m.min*60:null,finished:false,rec:null};
 if(qs.secs)Object.entries(qs.secs).forEach(([i,l])=>{if(SES.items[i])SES.items[i].sec=l;});
 if(extra)Object.assign(SES,extra);
 go('session');startTimer();}
function startTopic(tp,force){if(!topicAllowed(tp)){toast('🔒 '+B('Your teacher has disabled this topic for you.','Mwarimu yafunze iri somo kuri wewe.'),3500);return;}const p0=P();if(!force&&LESSONS[tp]&&!(p0.lessons||{})[tp]){modal(`<div class="center"><div style="font-size:50px">📖</div><h2>${B('Learn first?','Banza wige?')}</h2><p>You have not read the lesson cards for <b>${TP[tp].en}</b> yet. Reading them first will help you answer better.</p></div><div class="row" style="justify-content:center"><button class="btn gold" onclick="openLesson('${tp}')">📖 ${B('Learn first','Banza wige')}</button><button class="btn ghost" onclick="closeModal();startTopic('${tp}',true)">✏️ ${B('Practise now','Witoze ubu')}</button></div>`);return;}
 const used=new Set();const qs=[];for(let i=0;i<10;i++){const q=pickFrom(tp,null,used);if(q)qs.push(q);}
 startSession('topic','practice',qs,TP[tp].ic+' '+TP[tp].en);}
function startMistakes(){const p=P();const ids=Object.keys(p.wrong);if(!ids.length){toast('No mistakes to fix yet. Do a practice first! 💪');return;}
 const qs=shuffle(ids).slice(0,12).map(id=>BANK.find(q=>q.id===id)).filter(Boolean);
 qs.sort((a,b)=>TOPICS.findIndex(t=>t.id===a.tp)-TOPICS.findIndex(t=>t.id===b.tp));
 startSession('fix','practice',qs,'🛠️ Fix my mistakes');}
/* ============== TIMER ============== */
let TID=null;
function startTimer(){stopTimer();TID=setInterval(tick,1000);tick();}
function stopTimer(){if(TID)clearInterval(TID);TID=null;}
function tick(){if(!SES||SES.finished){stopTimer();return;}const el=$('tmr');const sec=Math.floor((Date.now()-SES.start)/1000);
 if(SES.limit){const left=SES.limit-sec;if(el){el.textContent='⏳ '+fmtT(Math.max(0,left));el.classList.toggle('low',left<=300);}
  if(left<=0){stopTimer();toast('⏰ Time is up!',3000);if(SES.style==='exam')submitExam(true);else finishSession();}}
 else if(el)el.textContent='⏱️ '+fmtT(sec);}
function fmtT(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');}
/* ============== QUESTION RENDERING ============== */
function qHead(it,num){const q=it.q;return `${q.cq?'<div class="muted" style="font-size:13px;font-weight:700;color:#8a6d00">⭐ A special question from your teacher</div>':''}<div class="qline"><span class="qn">${num})</span><span class="qt">${lkOK()?lk(q.q,q.tp):q.q}</span>${sayBtn("speak(this.closest('.qline').querySelector('.qt').innerText)")}<span class="qm">(${fmtM(q.m)} mark${q.m>1?'s':''})</span></div><div class="hint">${B(q.tfl?'Click '+q.tfl[0]+' or '+q.tfl[1]+' for each statement.':HINT[q.t][0],q.tfl?'Kanda kuri "'+q.tfl[0]+'" cyangwa "'+q.tfl[1]+'" kuri buri nteruro.':HINT[q.t][1])}</div>`;}
function body(it,ix,state){const q=it.q,lock=state!=='answer',show=state!=='answer',D=lock?'disabled':'';let h='';
 if(q.svg)h+=`<div class="fig">${FIG[q.svg]}</div>`;
 if(q.pic)h+=`<div class="fig"><img src="${q.pic}" alt="Picture for the question" style="max-width:100%;max-height:340px;object-fit:contain;border-radius:8px;cursor:pointer" onclick="tqBig(this.src)"></div>`;
 switch(q.t){
 case 'mc':case 'ms':{const isMs=q.t==='ms';if(isMs)h+=`<div class="muted" style="font-size:14px">Choose ${q.a.length}.</div>`;
  h+='<div class="opts">'+it.ord.map((oi,k)=>{const s=isMs?it.resp.includes(oi):it.resp===oi;const ok=isMs?q.a.includes(oi):q.a===oi;let c='opt'+(s?' sel':'');if(show){if(ok)c+=' right';else if(s)c+=' wrong';}
   return `<button class="${c}" ${D} onclick="pick(${ix},${oi})"><span class="let">${LET[k]}</span><span>${esc(q.o[oi])}</span>${show&&ok?' <span class="ok">✓</span>':''}${show&&s&&!ok?' <span class="no">✗</span>':''}</button>`;}).join('')+'</div>';break;}
 case 'tf':{const TL=q.tfl||['True','False'];h+=q.s.map((s,j)=>{const r=it.resp[j];const cls=v=>'pill'+(r===v?' sel':'')+(show&&s[1]===v?' right':'')+(show&&r===v&&s[1]!==v?' wrong':'');
   return `<div class="tfrow"><span class="tfl">${SUB[j]})</span><span class="tfs">${LK(esc(s[0]),q.tp)}</span><span><button class="${cls(true)}" ${D} onclick="tfp(${ix},${j},true)">${TL[0]}</button><button class="${cls(false)}" ${D} onclick="tfp(${ix},${j},false)">${TL[1]}</button></span></div>`;}).join('');break;}
 case 'ma':{const lab=!!q.svg;h+=`<table class="mt"><tr><th>${lab?'Letter':'Item'}</th><th>Your answer</th>${lab?'':'<th>Choices</th>'}</tr>`+q.l.map((l,j)=>{const r=it.resp[j];
   const sel=`<select class="${r!==null?'sel':''}" ${D} onchange="mat(${ix},${j},this.value)"><option value="">${lab?'choose a name':'choose'}</option>${it.ord.map((ri,k)=>`<option value="${ri}" ${r===ri?'selected':''}>${lab?esc(q.r[ri]):ROM[k]+')'}</option>`).join('')}</select>`;
   const mark=show?(r===j?' <span class="ok">✓</span>':` <span class="no">✗</span> <span class="ok">${lab?esc(q.r[j]):ROM[it.ord.indexOf(j)]+')'}</span>`):'';
   return `<tr><td><b>${lab?'':SUB[j]+') '}</b>${LK(fmtx(l),q.tp)}</td><td>${sel}${mark}</td>${lab?'':(j===0?`<td rowspan="${q.l.length}">${it.ord.map((ri,k)=>`<div>${ROM[k]}) ${esc(q.r[ri])}</div>`).join('')}</td>`:'')}</tr>`;}).join('')+'</table>';break;}
 case 'fb':{if(q.o)h+=`<div class="bank">${q.o.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`;
  h+=q.s.map((s,j)=>{const parts=s[0].split('___');const r=it.resp[j];const ok=fbEq(r,s[1]);
   const sel=`<select class="${r?'sel':''}" ${D} onchange="fbp(${ix},${j},this.value)"><option value="">..........</option>${it.pool[j].map(w=>`<option ${r===w?'selected':''}>${esc(w)}</option>`).join('')}</select>`;
   return `<div class="fbline">${q.s.length>1?'<b>'+SUB[j]+')</b> ':''}${LK(esc(parts[0]),q.tp)}${sel}${LK(esc(parts.slice(1).join('___')),q.tp)}${show?(ok?' <span class="ok">✓</span>':` <span class="no">✗</span> <span class="ok">${esc(s[1])}</span>`):''}</div>`;}).join('');break;}
 case 'cl':h+=`<table class="mt"><tr><th>Item</th>${q.c.map(c=>`<th style="text-align:center">${esc(c)}</th>`).join('')}</tr>`+it.iord.map(j=>{const x=q.i[j],r=it.resp[j];
   return `<tr><td>${LK(esc(x[0]),q.tp)}</td>${q.c.map((c,ci)=>{let cl='cellbtn'+(r===ci?' sel':'');if(show){if(x[1]===ci)cl+=' right';else if(r===ci)cl+=' wrong';}return `<td style="text-align:center"><button class="${cl}" ${D} onclick="clp(${ix},${j},${ci})">${r===ci||(show&&x[1]===ci)?'✓':''}</button></td>`;}).join('')}</tr>`;}).join('')+'</table>';break;
 case 'or':h+=`<div class="chips">${it.ord.map((oi,k)=>`<button class="ochip" ${lock||it.resp.includes(oi)?'disabled':''} onclick="orp(${ix},${oi})"><b>${LET[k]})</b> ${esc(q.i[oi])}</button>`).join('')}</div>
  <div class="seq"><b>Your order:</b> ${it.resp.length?it.resp.map((oi,n)=>`<div>${n+1}. ${esc(q.i[oi])}${show?(oi===n?' <span class="ok">✓</span>':' <span class="no">✗</span>'):''}</div>`).join(''):'<span class="muted">Click the items above in order.</span>'}</div>
  ${lock?'':`<button class="btn small ghost" onclick="orUndo(${ix})">↩ Undo</button> <button class="btn small ghost" onclick="SES.items[${ix}].resp=[];rq(${ix})">Clear</button>`}`;break;
 case 'op':h+=lock?`<div class="seq"><b>Your answer:</b> ${it.resp?esc(it.resp):'<span class="muted">(no answer)</span>'}</div>`:`<textarea id="ta${ix}" placeholder="Write your answer here..." oninput="SES.items[${ix}].resp=this.value">${esc(it.resp)}</textarea>`;break;
 case 'wr':h+=wrBody(it,ix,lock);break;
 case 'nu':h+=nuBody(it,ix,lock,show);break;
 case 'dr':h+=lock?`<div id="drlb${ix}" class="drlb-static">${(it.labels||[]).map(l=>`<span class="drl-placed" style="left:${l.x}%;top:${l.y}%">${esc(l.text)}</span>`).join('')}${FIG[q.fig]||'<div class="muted">(diagram)</div>'}</div>`:drBody(ix,it,q);break;
 }
 return h;}
function answerHTML(it){const q=it.q;switch(q.t){
 case 'mc':return `<b>${LET[it.ord.indexOf(q.a)]})</b> ${esc(q.o[q.a])}`;
 case 'ms':return q.a.map(a=>`<b>${LET[it.ord.indexOf(a)]})</b> ${esc(q.o[a])}`).join('<br>');
 case 'tf':{const TL=q.tfl||['True','False'];return q.s.map((s,j)=>`${SUB[j]}) ${s[1]?TL[0]:TL[1]}`).join('<br>');}
 case 'ma':return q.l.map((l,j)=>`${fmtx(l)} → ${esc(q.r[j])}`).join('<br>');
 case 'fb':return q.s.map((s,j)=>esc(s[0]).replace('___','<b><u>'+esc(s[1])+'</u></b>')).join('<br>');
 case 'cl':return q.c.map((c,ci)=>`<b>${esc(c)}:</b> ${q.i.filter(x=>x[1]===ci).map(x=>esc(x[0])).join(', ')}`).join('<br>');
 case 'or':return q.i.map((x,n)=>`${n+1}. ${esc(x)}`).join('<br>');
 case 'op':return q.ans;
 case 'dr':return `<div class="fig">${FIG[q.fig]}</div>`;
 case 'wr':return wrModel(q);
 case 'nu':return q.p.map(pt=>`${pt[0]?'<b>'+esc(pt[0])+'</b> ':''}${esc(nuShow(pt[1]))}${pt[2]?' '+esc(pt[2]):''}`).join('<br>');}}
function fbHTML(it,ix,mode){const q=it.q;const r=it.got/q.m;const cls=r>=1?'good':r>0?'part':'bad';
 const msgs=r>=1?[['Excellent! 🌟','Wakoze neza cyane!'],['Well done! 🎉','Ni byiza!'],['Great job! 💪','Ni sawa rwose!'],['You got it! ✨','Wabishoboye!']]:r>0?[['Good try! You got some marks. 👍','Wagerageje neza!']]:[['Not yet. Learn the correct answer below. 📖','Ntibikunze. Iga igisubizo nyacyo.']];
 const mg=msgs[ix%msgs.length];
 let h=`<div class="fb ${(q.t==='dr'||q.t==='wr')&&!it.marked?'part':cls}">`;
 if(q.t==='dr')h+=`<div class="h">${B('Compare your drawing with this model.','Gereranya igishushanyo cyawe n\'iki.')}</div>`;
 else if(q.t==='wr')h+=`<div class="h">${B('Now mark your composition with the checklist below.','Noneho kosora umwandiko wawe ukoresheje urutonde ruri hasi.')}</div>`;
 else h+=`<div class="h">${B(mg[0],mg[1])}</div><div>Marks: <b>${fmtM(it.got)} / ${fmtM(q.m)}</b></div>`;
 h+=`<div class="ansbox"><div class="lab">${q.t==='op'?'Model answer':q.t==='wr'?'How to score well':'Correct answer'}</div>${answerHTML(it)}</div>`;
 if(q.w&&q.t!=='op')h+=`<div class="why">💡 ${lk(q.w,q.tp)}</div>`;
 h+=whyWrong(it)+kwChips(q);
 if(q.t==='wr')h+=wrChecklist(it,ix);
 if(q.t==='dr')h+=`<div class="checks" style="margin-top:8px"><b>${B('Tick what your drawing has:','Shyiraho akamenyetso ku byo igishushanyo cyawe gifite:')}</b>${q.checks.map((c,j)=>`<label><input type="checkbox" ${it.checks[j]?'checked':''} onchange="drMark(${ix},${j},this.checked)"> ${esc(c)}</label>`).join('')}<div>Marks: <b id="drm${ix}">${fmtM(it.got)}</b> / ${fmtM(q.m)}</div></div>`;
 if(q.t==='op'&&mode==='review')h+=`<div class="adj">Teacher check: <button class="btn small ghost" onclick="tadj(${ix},-.5)">−½</button><button class="btn small ghost" onclick="tadj(${ix},.5)">+½</button></div>`;

function nuParse(s){s=String(s==null?'':s).trim().toLowerCase().replace(/[−\u2013]/g,'-').replace(/ /g,' ');if(!s)return NaN;
 s=s.replace(/^[^0-9\-+.]*/,'');if(/^[-+]?0,\d/.test(s))s=s.replace(',','.');let m=s.match(/^([-+]?\d+)\s+(\d+)\s*\/\s*(\d+)/);if(m){const a=+m[1];return a+(a<0?-1:1)*(+m[2]/+m[3]);}
 m=s.match(/^([-+]?\d+(?:[.,]\d+)?)\s*\/\s*(\d+(?:[.,]\d+)?)/);if(m)return parseFloat(m[1].replace(',','.'))/parseFloat(m[2].replace(',','.'));

function nuOne(a,r,tol){if(typeof a==='number'){const x=nuParse(r);return !isNaN(x)&&Math.abs(x-a)<=(tol!=null?tol:Math.max(1e-9,Math.abs(a)*1e-9));}

 case 'tf':g=q.s.filter((s,j)=>it.resp[j]===s[1]).length*q.m/q.s.length;break;

 case 'fb':g=q.s.filter((s,j)=>fbEq(it.resp[j],s[1])).length*q.m/q.s.length;break;
 case 'cl':g=q.i.filter((x,j)=>it.resp[j]===x[1]).length*q.m/q.i.length;break;
 case 'or':{const r=it.resp;g=(r.length===q.i.length&&r.every((x,j)=>x===j))?q.m:r.filter((x,j)=>x===j).length*q.m/q.i.length*.5;break;}
 case 'op':g=kw(it.resp,q);break;
 case 'dr':g=it.checks.filter(Boolean).length*q.m/it.checks.length;break;

 case 'nu':g=q.p.reduce((a,pt,j)=>a+(nuOK(pt,it.resp[j])?nuMk(q,j):0),0);break;}
 if(it.hinted)g=Math.max(0,g-0.5);

function findWordFor(text,tp){const n=norm(text);const A=allWords();

function wlink(text,tp){const w=findWordFor(text,tp);return w?` <span class="kwd" onclick="showWord('${w.id}')">${esc(w.w)}</span> means: ${esc(w.m)}`:'';}
function whyWrong(it){const q=it.q;if(it.got>=q.m)return '';const out=[];const R=it.resp;
 if(it.skipped)out.push('You did not answer this question. Read the correct answer above and try it next time.');
 else if(q.t==='mc'||q.t==='ms'){const chosen=q.t==='mc'?(R===null?[]:[R]):R.filter(x=>!q.a.includes(x));const right=q.t==='mc'?[q.a]:q.a;
  if(q.t==='mc'&&R===null)out.push('You did not choose an answer.');
  chosen.forEach(oi=>out.push(`You chose <b>${esc(q.o[oi])}</b>.${wlink(q.o[oi],q.tp)||' That does not answer this question.'}`));
  right.forEach(oi=>{if(q.t==='ms'&&R.includes(oi))return;const l=wlink(q.o[oi],q.tp);out.push(`The correct answer is <b>${esc(q.o[oi])}</b>.${l}`);});
  if(q.t==='ms'&&R.length<q.a.length)out.push('You had to choose '+q.a.length+' answers.');}
 else if(q.t==='tf'){q.s.forEach((s,j)=>{const r=R[j];if(r!==s[1])out.push(`${SUB[j]}) "${esc(s[0])}" is <b>${s[1]?'True':'False'}</b>${r===null?' (you did not answer)':', not '+(r?'True':'False')}.`);});}
 else if(q.t==='ma'){q.l.forEach((l,j)=>{if(R[j]!==j)out.push(`<b>${fmtx(l)}</b> goes with <b>${esc(q.r[j])}</b>${R[j]!=null?', not "'+esc(q.r[R[j]])+'"':' (you did not match it)'}.${wlink(l,q.tp)}`);});}
 else if(q.t==='fb'){q.s.forEach((s,j)=>{if(!fbEq(R[j],s[1]))out.push(`The gap ${q.s.length>1?SUB[j]+') ':''}needs <b>${esc(s[1])}</b>${R[j]?', not "'+esc(R[j])+'"':' (you left it empty)'}.${wlink(s[1],q.tp)||wlink(R[j]||'',q.tp)}`);});}
 else if(q.t==='cl'){q.i.forEach((x,j)=>{if(R[j]!==x[1])out.push(`<b>${esc(x[0])}</b> belongs to <b>${esc(q.c[x[1]])}</b>${R[j]!=null?', not "'+esc(q.c[R[j]])+'"':' (you did not tick it)'}.${wlink(x[0],q.tp)}`);});}
 else if(q.t==='or'){const wrongAt=q.i.map((x,n)=>R[n]===n?null:n).filter(n=>n!=null);if(R.length<q.i.length)out.push('You did not put all the items in order.');
  wrongAt.slice(0,4).forEach(n=>out.push(`Step ${n+1} is <b>${esc(q.i[n])}</b>${R[n]!=null?', not "'+esc(q.i[R[n]])+'"':''}.`));}
 else if(q.t==='op'){const nt=' '+norm(R||'')+' ';const miss=q.k.filter(g=>!g.split('|').some(x=>{x=norm(x.replace('#',''));return x&&nt.includes(x.length>4?x.slice(0,x.length-1):' '+x+' ');})).map(g=>g.split('|')[0].replace('#',''));
  out.push(R&&R.trim()?'Your answer is missing some key ideas.':'You did not write an answer.');
  if(miss.length)out.push('Try to use words like: <b>'+miss.slice(0,4).map(esc).join(', ')+'</b>. Compare with the model answer.');}
 else if(q.t==='dr')out.push('Compare your drawing with the model. Check the labels you forgot.');
 else if(q.t==='nu'){q.p.forEach((pt,j)=>{const r=String(R[j]||'').trim();if(!nuOK(pt,r))out.push(`${pt[0]?pt[0]+' ':''}${r?'You wrote <b>'+esc(r)+'</b>, but the answer is':'You left it empty. The answer is'} <b>${esc(nuShow(pt[1]))}${pt[2]?' '+esc(pt[2]):''}</b>.`);});out.push('Follow the working steps above to see how to get the answer.');}
 else if(q.t==='wr')out.push('Use the checklist: a good composition has an introduction, a body with at least three ideas, and a conclusion, with the right length.');
 return out.length?`<div class="whyw">🤔 <b>${B('Why was I wrong?','Kuki nibeshye?')}</b>${out.map(x=>`<div style="margin-top:4px">${x}</div>`).join('')}</div>`:'';}

 <div class="card hello"><div class="bigav">🎮</div><div style="flex:1;min-width:220px"><h2>${B('You have','Ufite')} ${p.play||0} ${B('game(s) to play','umukino/imikino')}</h2><div class="stats"><div class="stat">🏆 Score <b>100%</b> in a practice of 5 or more questions: <b>+1 game</b></div><div class="stat">📌 Pass an assignment from your teacher: <b>+1 game</b></div></div></div></div>

 <div class="grid g3" style="margin-top:16px">${GAMES.map(([k,ic,t,d])=>`<div class="card" style="margin:0;text-align:center"><div style="font-size:50px">${ic}</div><h3 style="margin:6px 0">${t}</h3><p class="muted" style="font-size:14px;min-height:40px">${d}</p><button class="btn ${acc.ok?'gold':'ghost'}" ${acc.ok?'':'disabled style="opacity:.5"'} onclick="startGame('${k}')">▶ ${B('Play','Kina')}</button></div>`).join('')}</div>
 <p style="margin-top:18px"><button class="btn ghost" onclick="go('home')">← ${B('Back','Subira inyuma')}</button></p>`;}
function startGame(k){const p=P();const acc=gameAccess(p);if(!acc.ok){go('games');return;}
 if(k==='bp'&&!BANK.some(q=>q.t==='cl')){toast('This game needs questions that are not in your class level yet.',4000);return;}
 p.play--;p.gplayed=(p.gplayed||0)+1;p.upd=Date.now();save();stopGameTimer();
 if(k==='mem')initMem();else if(k==='ws')initWS();else initBP();go('game');}
function gamePick(n,filter){const p=P();const pool=shuffle(allWords().filter(filter||(()=>true)));
 return pool.map(w=>({w,k:(wstage(p,w.id)===1?0:wstage(p,w.id)===0?1:2)+Math.random()*1.5})).sort((a,b)=>a.k-b.k).slice(0,n).map(x=>x.w);}
function gameOver(extra){if(!GM||GM.over)return;GM.over=true;GM.extra=extra||'';stopGameTimer();const p=P();p.stars+=1;p.upd=Date.now();save();refreshHeader();confetti();beep(true);render();}
function vGame(){if(!GM)return vGames();const G=GAMES.find(x=>x[0]===GM.k);
 const head=`<div class="sbar"><span class="timer">${G[1]} ${G[2]}</span><div class="prog"><i id="gbar" style="width:0"></i></div><span id="ginfo"></span><button class="btn small ghost" onclick="if(GM.over||confirm('Stop this game?')){stopGameTimer();GM=null;go('games')}">✕ ${B('Stop','Hagarika')}</button></div>`;
 if(GM.over)return head+`<div class="card center"><div style="font-size:60px">🎉</div><h1>${B('Well done!','Wakoze neza!')}</h1><p style="font-size:18px">${GM.extra}</p><p class="muted">⭐ +1 star</p>
  <div class="row" style="justify-content:center">${(P().play||0)>0&&gameAccess(P()).ok?`<button class="btn gold" onclick="go('games')">🎮 ${B('Play another game','Kina undi mukino')} (${P().play} left)</button>`:''}<button class="btn" onclick="GM=null;go('home')">📚 ${B('Back to learning','Subira kwiga')}</button></div></div>`;
 if(GM.k==='mem')return head+vMem();if(GM.k==='ws')return head+vWS();return head+vBP();}
/* ---- Memory match ---- */
function initMem(){const ws=gamePick(6,w=>w.m.length<=95);GM={k:'mem',ws,cards:shuffle(ws.flatMap(w=>[{id:w.id,f:'w'},{id:w.id,f:'m'}])),open:[],done:[],moves:0,start:Date.now(),lock:false};}
function vMem(){return `<p class="center" style="font-size:17px">${B('Find each word and its meaning. Moves:','Huza ijambo n\'igisobanuro. Inshuro:')} <b>${GM.moves}</b> · ${GM.done.length} / ${GM.ws.length} pairs</p>
 <div class="mgrid">${GM.cards.map((c,i)=>{const w=getWord(c.id)||{};const up=GM.open.includes(i),ok=GM.done.includes(c.id);
  return `<button class="mcard ${ok?'ok':up?'up':''}" onclick="memClick(${i})">${ok||up?(c.f==='w'?`<span style="font-size:30px">${w.ic||'📖'}</span><br><b style="font-size:16px">${esc(w.w)}</b>`:`<span style="font-size:13px">${esc(w.m)}</span>`):'❓'}</button>`;}).join('')}</div>`;}
function memClick(i){if(GM.lock||GM.over)return;const c=GM.cards[i];if(GM.done.includes(c.id)||GM.open.includes(i))return;GM.open.push(i);
 if(GM.open.length===2){GM.moves++;const[x,y]=GM.open.map(j=>GM.cards[j]);
  if(x.id===y.id){GM.done.push(x.id);GM.open=[];beep(true);if(GM.done.length===GM.ws.length){gameOver(`You matched all ${GM.ws.length} pairs in ${GM.moves} moves.`);return;}}
  else{GM.lock=true;setTimeout(()=>{if(!GM)return;GM.open=[];GM.lock=false;render();},1100);}}
 render();}
/* ---- Word search ---- */
function initWS(){const N=10;const ws=gamePick(30,w=>/^[A-Za-z]{3,9}$/.test(w.w));const g=Array.from({length:N},()=>Array(N).fill(''));const placed=[];const D=[[0,1],[1,0],[1,1]];
 for(const w of ws){if(placed.length>=6)break;const W_=w.w.toUpperCase();if(placed.some(x=>x.word===W_))continue;
  for(let t=0;t<200;t++){const[dr,dc]=D[Math.floor(Math.random()*3)];const r0=Math.floor(Math.random()*(N-(dr?W_.length-1:0))),c0=Math.floor(Math.random()*(N-(dc?W_.length-1:0)));
   const cells=[...W_].map((ch,k)=>[r0+dr*k,c0+dc*k]);if(cells.every(([r,c],k)=>!g[r][c]||g[r][c]===W_[k])){cells.forEach(([r,c],k)=>g[r][c]=W_[k]);placed.push({w,word:W_,cells,found:false});break;}}}
 const AB='ABCDEFGHIJKLMNOPRSTUWY';for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!g[r][c])g[r][c]=AB[Math.floor(Math.random()*AB.length)];
 GM={k:'ws',N,g,words:placed,sel:null,start:Date.now(),gave:false};}
function wsKey(r,c){return r+','+c;}
function vWS(){const fc=new Set(),gv=new Set();GM.words.forEach(x=>x.cells.forEach(([r,c])=>{if(x.found)fc.add(wsKey(r,c));else if(GM.gave)gv.add(wsKey(r,c));}));
 return `<p class="center" style="font-size:17px">${B('Click the first letter, then the last letter of a word.','Kanda inyuguti ya mbere, hanyuma iya nyuma.')} · <b>${GM.words.filter(x=>x.found).length} / ${GM.words.length}</b> found</p>
 <div class="row" style="align-items:flex-start;justify-content:center;gap:24px"><table class="wsg">${GM.g.map((row,r)=>`<tr>${row.map((ch,c)=>{const k=wsKey(r,c);const s=GM.sel&&GM.sel[0]===r&&GM.sel[1]===c;return `<td><button class="wsc ${s?'s':fc.has(k)?'f':gv.has(k)?'gv':''}" onclick="wsClick(${r},${c})">${ch}</button></td>`;}).join('')}</tr>`).join('')}</table>
 <div style="min-width:240px;max-width:340px">${GM.words.map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">${x.found?'✅':'🔍'} <b style="${x.found?'text-decoration:line-through':''}">${esc(x.w.w)}</b><div class="muted" style="font-size:13px">${esc(x.w.m)}</div></div>`).join('')}
 <button class="btn small ghost" style="margin-top:10px" onclick="GM.gave=true;render();setTimeout(()=>gameOver('You found '+GM.words.filter(x=>x.found).length+' of '+GM.words.length+' words.'),2500)">${B('Show the answers','Erekana ibisubizo')}</button></div></div>`;}
function wsClick(r,c){if(GM.over||GM.gave)return;if(!GM.sel){GM.sel=[r,c];render();return;}const[r1,c1]=GM.sel;GM.sel=null;const dr=Math.sign(r-r1),dc=Math.sign(c-c1),len=Math.max(Math.abs(r-r1),Math.abs(c-c1))+1;
 if(!(r===r1||c===c1||Math.abs(r-r1)===Math.abs(c-c1))||len<2){render();return;}
 const cells=Array.from({length:len},(_,k)=>[r1+dr*k,c1+dc*k]);const s=cells.map(([a,b])=>GM.g[a][b]).join('');
 const hit=GM.words.find(x=>!x.found&&(x.word===s||x.word===[...s].reverse().join('')));
 if(hit){hit.found=true;wordResult(hit.w.id,true);save();beep(true);if(GM.words.every(x=>x.found)){gameOver(`You found all ${GM.words.length} words!`);return;}}else beep(false);render();}
/* ---- Balloon pop ---- */
const BCOL=['#e04848','#3b82f6','#16a34a','#9333ea','#ea580c','#0891b2','#db2777','#ca8a04'];
function initBP(){const rounds=[];shuffle(BANK.filter(q=>q.t==='cl')).forEach(q=>{if(rounds.length>=10)return;const cols=shuffle(q.c.map((_,i)=>i)).filter(ci=>q.i.filter(x=>x[1]===ci).length>=1&&q.i.some(x=>x[1]!==ci));if(!cols.length)return;const ci=cols[0];
  const items=shuffle(q.i.map(x=>({t:x[0],ok:x[1]===ci}))).map((it,k,arr)=>Object.assign(it,{x:3+k*(84/Math.max(1,arr.length-1)),d:7+Math.random()*4,del:Math.random()*6,col:BCOL[(k+rounds.length)%BCOL.length]}));
  rounds.push({q,title:q.c[ci],items,popped:0,need:items.filter(x=>x.ok).length});});
 GM={k:'bp',rounds,ri:0,score:0,end:Date.now()+90000,start:Date.now()};
 setTimeout(()=>{stopGameTimer();GTID=setInterval(()=>{if(!GM||GM.k!=='bp'||GM.over){stopGameTimer();return;}const left=Math.max(0,GM.end-Date.now());const e=$('bpt');if(e)e.textContent=Math.ceil(left/1000)+'s';const b=$('gbar');if(b)b.style.width=(left/90000*100)+'%';if(left<=0)gameOver(`Time is up! You scored ${GM.score} points.`);},250);},50);}
function vBP(){const R=GM.rounds[GM.ri];if(!R)return '';
 return `<div class="row" style="justify-content:space-between;margin-bottom:8px"><div style="font-size:20px">${B('Pop the balloons:','Mena imipira:')} <b style="color:var(--navy);font-size:24px">${esc(R.title)}</b> <span class="muted" style="font-size:14px">(${TP[R.q.tp].ic} ${SHORT[R.q.tp]})</span></div><div style="font-size:20px">⏳ <b id="bpt">90s</b> · ⭐ <b id="bpsc">${GM.score}</b> · Round ${GM.ri+1}</div></div>
 <div class="bparea">${R.items.map((it,i)=>`<button class="balloon" id="bl${i}" style="left:${it.x}%;background:${it.col};animation-duration:${it.d}s;animation-delay:-${it.del}s" onclick="bpPop(${i})">${esc(it.t)}</button>`).join('')}</div>
 <p class="muted center" style="font-size:14px">${B('Right balloon: +1 point. Wrong balloon: -1 point.','Umupira nyawo: +1. Uwibeshye: -1.')}</p>`;}
function bpPop(i){if(!GM||GM.over)return;const R=GM.rounds[GM.ri];const it=R.items[i];const el=$('bl'+i);
 if(it.ok){if(it.done)return;it.done=true;R.popped++;GM.score++;beep(true);if(el)el.remove();
  if(R.popped>=R.need){GM.ri++;if(GM.ri>=GM.rounds.length){gameOver(`You finished all the rounds with ${GM.score} points!`);return;}toast('🎈 Round complete! Next group...',1400);render();return;}}
 else{GM.score=Math.max(0,GM.score-1);beep(false);if(el){el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),600);}}
 const s=$('bpsc');if(s)s.textContent=GM.score;}

 <p class="muted" style="font-size:13px;margin-bottom:0">${cloudOn()?'This setting reaches your students online automatically.':'This setting reaches other computers when you load the class file there.'}</p></div>`;}
function setG(o){const me=TU();me.gset=Object.assign(gset(me.id),o);me.upd=Date.now();save();toast(o.on===false?'⛔ Games are stopped for your class.':o.on?'✅ Games are on.':o.lock?'🔒 Games locked until assignments are passed.':'🔓 Games no longer need assignments.',3000);render();}
function toggleClassTopicLock(tid){const me=TU();const g=gset(me.id);g.disabledTopics=g.disabledTopics||[];const i=g.disabledTopics.indexOf(tid);if(i>=0){g.disabledTopics.splice(i,1);toast('✓ Topic unlocked for the whole class.');}else{g.disabledTopics.push(tid);toast('🔒 Topic locked for the whole class.');}me.gset=g;me.upd=Date.now();save();render();}
function toggleClassSubjLock(sid){const me=TU();const g=gset(me.id);g.disabledSubjs=g.disabledSubjs||[];const i=g.disabledSubjs.indexOf(sid);if(i>=0){g.disabledSubjs.splice(i,1);toast('✓ Subject unlocked for the whole class.');}else{g.disabledSubjs.push(sid);toast('🔒 Subject locked for the whole class.');}me.gset=g;me.upd=Date.now();save();render();}
function giveAll(){let n=0;S.profiles.forEach(p=>{if(p.cls===TU().id&&p.status==='active'){p.play=(p.play||0)+1;p.upd=Date.now();n++;}});save();toast('🎁 '+n+' student(s) on this computer received 1 game.',3000);render();}

/* ============== PASSPORT PHOTO: automatic check + capture panel ============== */
/* The app first checks the photo looks like a passport photo (one clear face, centred, good light,
   plain background). It can reject a photo. The teacher then makes the final decision. */
async function passportCheck(dataURL){const im=await loadImg(dataURL);const why=[];if(!im)return{ok:false,why:['the picture cannot be opened']};
 const fd={faces:null};
 try{if('FaceDetector' in window){const det=new FaceDetector({fastMode:true,maxDetectedFaces:4});const f=await det.detect(im);fd.faces=f.length;
  if(f.length>1)why.push('more than one person is in the photo');else if(f.length===1){const b=f[0].boundingBox;if(b.width*b.height/(im.width*im.height)<0.05)why.push('the face is too small, come closer to the camera');}}}catch(e){fd.faces=null;}
 const W=160,H=Math.max(40,Math.round(W*im.height/im.width));const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.drawImage(im,0,0,W,H);
 const d=x.getImageData(0,0,W,H).data;const N=W*H;const Y=new Float32Array(N);const skin=new Uint8Array(N);let sum=0,sq=0;
 for(let i=0;i<N;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2];const y=0.299*r+0.587*g+0.114*b,cb=128-0.168736*r-0.331264*g+0.5*b,cr=128+0.5*r-0.418688*g-0.081312*b;
  Y[i]=y;sum+=y;sq+=y*y;if(y>30&&cb>=73&&cb<=132&&cr>=132&&cr<=180&&r>g)skin[i]=1;}
 const mean=sum/N,sd=Math.sqrt(Math.max(0,sq/N-mean*mean));
 if(mean<55)why.push('the photo is too dark, stand in good light');else if(mean>240)why.push('the photo is too bright');
 if(sd<18)why.push('the photo is not clear');
 let lap=0,ls=0,lc=0;for(let yy=1;yy<H-1;yy++)for(let xx=1;xx<W-1;xx++){const i=yy*W+xx;const v=4*Y[i]-Y[i-1]-Y[i+1]-Y[i-W]-Y[i+W];ls+=v;lap+=v*v;lc++;}
 const lapVar=lap/lc-(ls/lc)*(ls/lc);if(lapVar<14)why.push('the photo is blurry, hold the camera still');
 /* face-like region: largest skin-coloured area */
 const lab=new Int32Array(N).fill(-1);const comps=[];
 for(let i=0;i<N;i++){if(!skin[i]||lab[i]>=0)continue;const st=[i];lab[i]=comps.length;const c={n:0,x0:W,x1:0,y0:H,y1:0};
  while(st.length){const k=st.pop();c.n++;const kx=k%W,ky=(k/W)|0;if(kx<c.x0)c.x0=kx;if(kx>c.x1)c.x1=kx;if(ky<c.y0)c.y0=ky;if(ky>c.y1)c.y1=ky;
   [k-1,k+1,k-W,k+W].forEach(j=>{if(j<0||j>=N)return;if((j===k-1&&kx===0)||(j===k+1&&kx===W-1))return;if(skin[j]&&lab[j]<0){lab[j]=comps.length;st.push(j);}});}
  comps.push(c);}
 comps.sort((a,b)=>b.n-a.n);const A=comps[0],B2=comps[1];
 if(fd.faces===0&&!A)why.push('no face was found');
 if(fd.faces==null||fd.faces===1){
  if(!A||A.n/N<0.035){if(fd.faces==null)why.push('no face was found in the middle of the photo');}
  else{const fr=A.n/N,cx=(A.x0+A.x1)/2/W,top=A.y0/H,bw=(A.x1-A.x0+1)/W,bh=(A.y1-A.y0+1)/H;
   if(fr>0.6||(bw>0.92&&bh>0.92))why.push('use a plain light background behind you');
   else{if(cx<0.22||cx>0.78)why.push('put your face in the middle of the photo');if(top>0.6)why.push('your face should be in the upper part of the photo');
    if(B2&&B2.n>0.55*A.n&&B2.n/N>0.03&&fd.faces==null){const c2=(B2.x0+B2.x1)/2/W;if(Math.abs(c2-cx)>0.25&&B2.y0/H<0.6)why.push('more than one person is in the photo');}}}}
 return{ok:!why.length,why:[...new Set(why)],at:Date.now()};}

/* ============== DEADLINES ============== */
function dueTs(a){if(!a||!a.due)return null;const t=new Date(a.due+'T'+(a.dueT||'23:59')+':00').getTime();return isNaN(t)?null:t;}
function isLate(a){const t=dueTs(a);return t!=null&&Date.now()>t;}
function dueTxt(a){if(!a.due)return '';const d=a.due===today()?'today':a.due===addDays(1)?'tomorrow':a.due;return 'due '+d+' at '+(a.dueT||'23:59');}
function dueLeft(a){const t=dueTs(a);if(t==null)return '';const ms=t-Date.now();if(ms<=0)return 'time is over';const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);if(h>=48)return Math.floor(h/24)+' days left';return (h?h+' h ':'')+m+' min left';}
function hhmm(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function setDue(k){const d=new Date();if(k==='1h'||k==='2h'){d.setMinutes(Math.ceil((d.getMinutes()+(k==='1h'?60:120))/5)*5,0,0);AF.due=ymd(d);AF.dueT=hhmm(d);}
 else if(k==='today'){AF.due=today();AF.dueT='17:00';}else if(k==='tom'){AF.due=addDays(1);AF.dueT='17:00';}else{AF.due=addDays(7);AF.dueT='17:00';}render();}
function fmtTs(t){const d=new Date(t);return ymd(d)+' '+hhmm(d);}

 else if(RM.to==='unfinished'){const a=asgs().find(x=>x.id===RM.aid);const u=a?R.filter(r=>asgFor(a,r)&&asgStat(a,r).st!==3):[];if(!u.length){toast('Everyone has already passed this assignment. 🎉');return;}to=u.map(r=>({id:r.id,name:r.name}));}
 const n=to==='all'?R.length:to.length;
 rems().push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),cls:me.id,from:me.name,text,aid:RM.aid||'',to,at:Date.now()});save();
 RM={to:'all',sel:[],aid:'',text:''};toast('📨 Reminder sent to '+n+' student(s). They will see it when they log in.',3500);render();}
function quickRemind(aid){const a=asgs().find(x=>x.id===aid);if(!a)return;const u=classRecs().filter(r=>asgFor(a,r)&&asgStat(a,r).st!==3);if(!u.length){toast('Everyone has already passed. 🎉');return;}
 const text='Reminder: please finish "'+a.title+'" '+(a.due?dueTxt(a):'soon')+'. You need '+a.target+'% to pass.';
 if(!confirm('Send this reminder to '+u.length+' student(s) who have not finished?\n\n'+text))return;
 rems().push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),cls:TU().id,from:TU().name,text,aid,to:u.map(r=>({id:r.id,name:r.name})),at:Date.now()});save();toast('🔔 Reminder sent to '+u.length+' student(s).',3200);render();}
function remindOne(id){const r=classRecs().find(x=>x.id===id);RM={to:'sel',sel:[id],aid:'',text:''};TDET=null;TTAB='rem';render();window.scrollTo(0,0);toast('Write your reminder for '+esc(r?r.name:'the student')+'.');}
function delRem(id){if(!confirm('Delete this reminder? Students will no longer see it.'))return;S.reminders=rems().filter(m=>m.id!==id);save();render();}
/* ============== SUBJECT DATA (each subject keeps its own learning data; accounts and classes are shared) ============== */
const LEARN=['stars','seen','wrong','topic','hist','badges','light','days','fixed','qr','ty','asg','words','lessons'];
function freshLearn(){return{stars:0,seen:{},wrong:{},topic:{},hist:[],badges:[],light:0,days:[],fixed:0,qr:{},ty:{},asg:{},words:{},lessons:{}};}
function stashSubj(id){S.sdata=S.sdata||{};S.sdata[id]={assigns:S.assigns||[],tqs:S.tqs||[],wordEdits:S.wordEdits||{},customWords:S.customWords||[],book:TD().book||{}};
 S.profiles.forEach(p=>{p.sd=p.sd||{};const o={};LEARN.forEach(k=>{if(k in p){o[k]=p[k];delete p[k];}});p.sd[id]=o;});}
function loadSubj(id){const d=(S.sdata||{})[id]||{};S.assigns=d.assigns||[];S.tqs=d.tqs||[];S.wordEdits=d.wordEdits||{};S.customWords=d.customWords||[];TD().book=d.book||{};if(S.sdata)delete S.sdata[id];
 S.profiles.forEach(p=>{const o=Object.assign(freshLearn(),(p.sd&&p.sd[id])||{});Object.assign(p,o);if(p.sd)delete p.sd[id];});}
function switchData(id){if(!SUBCFG[id]||id===S.subj)return;stashSubj(S.subj);loadSubj(id);S.subj=id;applySubject(id);}
function withSubj(id,fn){id=SUBCFG[id]?id:'set';const old=S.subj;if(id!==old)switchData(id);try{return fn();}finally{if(id!==old)switchData(old);}}
function allSubjDo(fn){Object.keys(SUBCFG).forEach(id=>withSubj(id,fn));}
function setSubject(id){if(!SUBCFG[id]||!PACKS[id])return false;if(SES&&!SES.finished){toast('Finish or quit the practice first.');return false;}SES=null;stopLight();switchData(id);save();return true;}
function subjBtns(){const L=Object.keys(SUBCFG).filter(id=>PACKS[id]&&PACKS[id].bank.length&&subjAllowed(id));if(L.length<2)return '';return `<span class="sjsw noprint">${L.map(id=>`<button class="${id===S.subj?'on':''}" onclick="if(setSubject('${id}'))render()">${SUBCFG[id].ic} ${SUBCFG[id].short}</button>`).join('')}</span>`;}

S.cur=null;SCREEN='subjects';

S.profiles.forEach(p=>{if(p.photo&&!p.photoStatus)p.photoStatus='pending';});cleanWall();
render();
if(cloudOn())cDir(true);
